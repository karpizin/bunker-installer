name: Installer CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n install.sh
      - name: Test pinned bootstrap entry
        run: python3 -m unittest discover -s tests -v
